<script>
  // --- Scroll-Spy (aktive Sektion im Menü hervorheben) ---
  const navLinks = Array.from(document.querySelectorAll('#mainmenu a[href^="#"]'));
  const sectionIds = ['home','portfolio','ueber-uns','kontakt','impressum'];
  const sectionMap = new Map(
    sectionIds
      .map(id => [id, document.getElementById(id)])
      .filter(([,el]) => !!el)
  );

  function setActiveLink(id){
    navLinks.forEach(a=>{
      const isActive = a.getAttribute('href') === `#${id}`;
      a.classList.toggle('active', isActive);
      if(isActive){ a.setAttribute('aria-current','page'); }
      else{ a.removeAttribute('aria-current'); }
    });
  }

  // IntersectionObserver mit Header-Offset
  const headerHeight = document.querySelector('header').offsetHeight || 0;
  const observer = new IntersectionObserver((entries)=>{
    // wähle den Eintrag mit dem größten Sichtbarkeitsanteil
    let best = null;
    for(const e of entries){
      if(!e.isIntersecting) continue;
      if(!best || e.intersectionRatio > best.intersectionRatio) best = e;
    }
    if(best){
      const id = best.target.getAttribute('id');
      if(id) setActiveLink(id);
    }
  },{
    // oberer Rand verschoben, damit Section als "aktiv" zählt, wenn sie unter dem Sticky-Header beginnt
    rootMargin: `-${headerHeight + 10}px 0px -55% 0px`,
    threshold: [0.25, 0.5, 0.75] // reagiert, wenn ~25% sichtbar
  });

  // beobachten
  sectionMap.forEach((el)=>observer.observe(el));

  // beim Initial-Load und Hash-Änderung ebenfalls setzen
  function applyByHash(){
    const h = location.hash.replace('#','');
    if(h && sectionMap.has(h)) setActiveLink(h);
  }
  window.addEventListener('hashchange', applyByHash);
  window.addEventListener('load', applyByHash);
</script>
